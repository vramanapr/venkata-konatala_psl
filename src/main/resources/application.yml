spring:
  application:
    name: audit-log-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditlog}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  sql:
    init:
      mode: never

audit:
  security:
    enabled: ${AUDIT_SECURITY_ENABLED:true}
    # Comma-separated: username=password|audit:write+audit:read
    users: ${AUDIT_SECURITY_USERS:}
  export:
    signature:
      enabled: ${AUDIT_EXPORT_SIGNATURE_ENABLED:false}
      key-id: ${AUDIT_EXPORT_SIGNATURE_KEY_ID:export-key-1}
      private-key: ${AUDIT_EXPORT_SIGNATURE_PRIVATE_KEY:}
      public-key: ${AUDIT_EXPORT_SIGNATURE_PUBLIC_KEY:}
  retention:
    enabled: ${AUDIT_RETENTION_ENABLED:true}
    window: ${AUDIT_RETENTION_WINDOW:365d}
    interval-ms: ${AUDIT_RETENTION_INTERVAL_MS:3600000}
    mode: ${AUDIT_RETENTION_MODE:SOFT_DELETE}
    batch-size: ${AUDIT_RETENTION_BATCH_SIZE:500}
  checkpoint:
    enabled: ${AUDIT_CHECKPOINT_ENABLED:true}
    interval-ms: ${AUDIT_CHECKPOINT_INTERVAL_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
